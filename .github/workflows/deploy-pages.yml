name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "cricket-box2box/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cricket-box2box/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cricket-box2box/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Set the VITE_API_BASE repository variable (Settings > Secrets and variables > Actions > Variables)
          # to the deployed backend URL (e.g. https://cross-bat-api.onrender.com) once it exists.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cricket-box2box/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
